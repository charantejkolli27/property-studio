<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Property Studio — Launching Soon</title>
  <meta name="description" content="Property Studio by Swamy Reddy Javidi — Real Estate, Visual Stories, Market Trends & Insights.">
  <meta name="theme-color" content="#b8952f">
  <style>
    :root{--gold:#b8952f;--navy:#0b2545;--ink:#101010;--paper:#fbfaf7}
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}
    body{display:flex;align-items:center;justify-content:center;padding:28px}
    main{width:min(1180px,100%);min-height:calc(100vh - 56px);display:grid;grid-template-columns:1.02fr .98fr;background:#fff;box-shadow:0 24px 80px rgba(11,37,69,.12);overflow:hidden}
    .visual{background:var(--gold);display:flex;align-items:center;justify-content:center;padding:28px;position:relative}
    .visual img{width:100%;height:auto;max-height:calc(100vh - 112px);object-fit:contain;object-position:center;mix-blend-mode:normal}
    .content{display:flex;flex-direction:column;justify-content:center;padding:clamp(36px,7vw,90px);position:relative}
    .eyebrow{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:800;margin-bottom:18px}
    h1{font-family:Georgia,serif;font-size:clamp(44px,6vw,78px);line-height:.95;margin:0 0 22px;color:var(--navy)}
    h1 span{color:var(--gold)}
    .rule{width:82px;height:4px;background:var(--gold);margin:24px 0}
    p{font-size:18px;line-height:1.7;max-width:580px;color:#4c4c4c;margin:0}
    .launch{display:inline-flex;align-items:center;gap:12px;margin-top:34px;padding:14px 20px;border:1px solid var(--gold);color:var(--navy);font-weight:900;letter-spacing:.12em;text-transform:uppercase;width:max-content}
    .dot{width:9px;height:9px;background:var(--gold);border-radius:50%;box-shadow:0 0 0 6px rgba(184,149,47,.12)}
    footer{position:absolute;bottom:24px;left:clamp(36px,7vw,90px);right:clamp(36px,7vw,90px);display:flex;justify-content:space-between;gap:20px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#777}
    @media(max-width:800px){body{padding:0}main{min-height:100vh;display:flex;flex-direction:column}.visual{padding:18px}.visual img{max-height:55vh}.content{padding:42px 28px 100px}.content h1{font-size:48px}footer{left:28px;right:28px;bottom:28px;flex-wrap:wrap}}
  </style>
</head>
<body>
  <main>
    <section class="visual"><img src="assets/property-studio-launch.png" alt="Property Studio by Swamy Reddy Javidi — Launching Soon"></section>
    <section class="content">
      <div class="eyebrow">A new real-estate media platform</div>
      <h1>Property <span>Studio</span></h1>
      <div class="rule"></div>
      <p>Real estate, visual stories, market trends and insights — presented with clarity, credibility and a sharper visual perspective.</p>
      <div class="launch"><span class="dot"></span> Launching Soon</div>
      <footer><span>By Swamy Reddy Javidi</span><span>Real Estate • Visual Stories</span></footer>
    </section>
  </main>
</body>
</html>
